# Festy · backend autoalojado: API Node + PostgreSQL + autenticación.
#
#   cd despliegue
#   ./scripts/generar-secretos.sh   # crea .env con claves nuevas (una sola vez)
#   docker compose up -d
#   ./scripts/migrar.sh             # aplica las migraciones de ../supabase/migrations
#
# Servicios: base de datos (PostgreSQL de Supabase, con pg_cron/vault),
# autenticación (GoTrue), API de Festy (Node, solo ejecuta stored procedures
# api.sp_*), Studio (solo en 127.0.0.1, por túnel SSH) y Caddy como entrada
# con HTTPS. No se expone PostgREST: el front habla únicamente con la API.

name: festy

services:
  db:
    container_name: festy-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      - ./volumes/db/webhooks.sql:/docker-entrypoint-initdb.d/init-scripts/98-webhooks.sql:Z
      - ./volumes/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - db-datos:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_EXP: ${JWT_EXPIRY}
      TZ: America/Argentina/Buenos_Aires
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf", "-c", "log_min_messages=fatal"]
    # La base NO se publica a internet. Para conectarte desde tu compu usá un túnel SSH:
    #   ssh -L 5432:127.0.0.1:5432 usuario@vps
    ports:
      - "127.0.0.1:${PUERTO_DB_LOCAL:-5432}:5432"

  auth:
    container_name: festy-auth
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${URL_PUBLICA_API}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${URL_FRONT}
      GOTRUE_URI_ALLOW_LIST: ${URLS_REDIRECCION_EXTRA}
      GOTRUE_DISABLE_SIGNUP: ${DESACTIVAR_REGISTRO}
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${URL_PUBLICA_API}/auth/v1
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: ${AUTOCONFIRMAR_EMAIL}
      GOTRUE_PASSWORD_MIN_LENGTH: 8
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_REMITENTE}
      GOTRUE_SMTP_HOST: ${SMTP_HOST}
      GOTRUE_SMTP_PORT: ${SMTP_PUERTO}
      GOTRUE_SMTP_USER: ${SMTP_USUARIO}
      GOTRUE_SMTP_PASS: ${SMTP_CLAVE}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_NOMBRE}
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Confirmá tu cuenta de Festy"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "Recuperá tu contraseña de Festy"
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: "Confirmá tu nuevo email"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 30

  api:
    container_name: festy-api
    build:
      context: ..
    image: festy-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_healthy
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      AUTH_JWKS_URL: http://auth:9999/.well-known/jwks.json
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${URL_PUBLICA_API}/auth/v1
      ORIGENES_PERMITIDOS: ${URL_FRONT},https://localhost,capacitor://localhost,http://localhost
      FIREBASE_SERVICE_ACCOUNT: ${FIREBASE_SERVICE_ACCOUNT:-}
      TZ: America/Argentina/Buenos_Aires

  meta:
    container_name: festy-meta
    image: supabase/postgres-meta:v0.100.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
      CRYPTO_KEY: ${PG_META_CRYPTO_KEY}

  # Panel de administración. Solo escucha en el propio VPS:
  #   ssh -L 3000:127.0.0.1:3000 usuario@vps   y abrir http://localhost:3000
  studio:
    container_name: festy-studio
    image: supabase/studio:2026.10.12-sha-3699278
    restart: unless-stopped
    depends_on:
      meta:
        condition: service_started
    environment:
      HOSTNAME: "0.0.0.0"
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PORT: 5432
      POSTGRES_HOST: db
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER_READ_WRITE: postgres
      PG_META_CRYPTO_KEY: ${PG_META_CRYPTO_KEY}
      DEFAULT_ORGANIZATION_NAME: Festy
      DEFAULT_PROJECT_NAME: Festy
      SUPABASE_URL: http://gateway:8000
      SUPABASE_PUBLIC_URL: ${URL_PUBLICA_API}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      AUTH_JWT_SECRET: ${JWT_SECRET}
      ENABLED_FEATURES_LOGS_ALL: "false"
    ports:
      - "127.0.0.1:${PUERTO_STUDIO_LOCAL:-3000}:3000"

  # Entrada única: /api (API de Festy) y /auth/v1 (GoTrue). Caddy obtiene el
  # certificado HTTPS solo para API_DOMINIO. Si el VPS ya tiene Traefik/Easypanel
  # en 80/443, cambiá PUERTO_HTTP/PUERTO_HTTPS y apuntá tu dominio al puerto 8000.
  gateway:
    container_name: festy-gateway
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on:
      auth:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      API_DOMINIO: ${API_DOMINIO}
      URL_FRONT: ${URL_FRONT}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-datos:/data
      - caddy-config:/config
    ports:
      - "${PUERTO_HTTP:-80}:80"
      - "${PUERTO_HTTPS:-443}:443"
      - "${PUERTO_GATEWAY:-127.0.0.1:8000}:8000"

volumes:
  db-datos:
  db-config:
  caddy-datos:
  caddy-config:
